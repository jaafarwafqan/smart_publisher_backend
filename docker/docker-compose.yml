# Smart Publisher backend — local/production-shaped Docker Compose.
# New as of 2026-07-27; this project had no Docker setup before this pass.
# Run from the repo root: docker compose -f docker/docker-compose.yml up -d
#
# Secrets must be injected by the deployment runtime; this file intentionally
# has no fallback passwords or application key values.

x-laravel-environment: &laravel-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "${APP_KEY:?Set APP_KEY through the deployment secret store}"
  APP_URL: "${APP_URL:?Set APP_URL through the deployment configuration}"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: "${DB_DATABASE:?Set DB_DATABASE through the deployment configuration}"
  DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME through the deployment secret store}"
  DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD through the deployment secret store}"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD through the deployment secret store}"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    environment: *laravel-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # PublishPostJob/RetryDeadLetteredAttemptJob explicitly dispatch onto the
    # "publishing" queue (config/publishing.php); everything else (scheduled
    # posts dispatch, token refresh, ...) uses Laravel's "default" queue.
    # Without listing both, queue:work only drains "default" and publish jobs
    # sit stuck in Redis forever.
    command: ["php", "artisan", "queue:work", "--queue=publishing,default", "--tries=3", "--backoff=10,30,60"]
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    environment: *laravel-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # IMPORTANT: SQLite must never be substituted here if this service is
    # ever scaled beyond 1 replica — PDO SQLite's busy_timeout does not
    # reliably gate multi-process write contention (confirmed during this
    # project's Production Readiness Audit). MySQL is required for any
    # deployment running more than one queue worker.

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    environment: *laravel-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?Set DB_DATABASE through the deployment configuration}"
      MYSQL_USER: "${DB_USERNAME:?Set DB_USERNAME through the deployment secret store}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD through the deployment secret store}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD through the deployment secret store}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD through the deployment secret store}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_storage:
  mysql_data:
  redis_data:
