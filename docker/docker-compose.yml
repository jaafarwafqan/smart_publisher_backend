# Smart Publisher backend — local/production-shaped Docker Compose.
# New as of 2026-07-27; this project had no Docker setup before this pass.
# Run from the repo root: docker compose -f docker/docker-compose.yml up -d
#
# Secrets must be injected by the deployment runtime; this file intentionally
# has no fallback passwords or application key values.

x-laravel-environment: &laravel-environment
  APP_ENV: "${APP_ENV:-production}"
  APP_DEBUG: "false"
  APP_KEY: "${APP_KEY:?Set APP_KEY through the deployment secret store}"
  APP_URL: "${APP_URL:?Set APP_URL through the deployment configuration}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?Set exact HTTPS frontend origins}"
  TRUSTED_PROXIES: "*"
  SECURITY_REQUIRE_HTTPS: "true"
  SESSION_SECURE_COOKIE: "true"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: "${DB_DATABASE:?Set DB_DATABASE through the deployment configuration}"
  DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME through the deployment secret store}"
  DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD through the deployment secret store}"
  CACHE_STORE: database
  DB_CACHE_CONNECTION: mysql
  DB_CACHE_TABLE: cache
  DB_CACHE_LOCK_CONNECTION: mysql
  DB_CACHE_LOCK_TABLE: cache_locks
  QUEUE_CONNECTION: database
  DB_QUEUE_CONNECTION: mysql
  DB_QUEUE_TABLE: jobs
  DB_QUEUE: default
  DB_QUEUE_RETRY_AFTER: "120"
  QUEUE_FAILED_DRIVER: database-uuids
  SESSION_DRIVER: database
  SESSION_CONNECTION: mysql
  SESSION_TABLE: sessions
  PUBLISH_QUEUE_NAME: publishing
  MAIL_MAILER: "${MAIL_MAILER:?Configure an actual mail provider (for example smtp)}"
  MAIL_SCHEME: "${MAIL_SCHEME:-tls}"
  MAIL_HOST: "${MAIL_HOST:?Set the mail provider hostname}"
  MAIL_PORT: "${MAIL_PORT:-587}"
  MAIL_USERNAME: "${MAIL_USERNAME:?Set through the deployment secret store}"
  MAIL_PASSWORD: "${MAIL_PASSWORD:?Set through the deployment secret store}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:?Set a verified sender address}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Smart Publisher}"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    environment: *laravel-environment
    depends_on:
      mysql:
        condition: service_healthy

  queue-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # PublishPostJob/RetryDeadLetteredAttemptJob explicitly dispatch onto the
    # "publishing" queue (config/publishing.php); everything else (scheduled
    # posts dispatch, token refresh, ...) uses Laravel's "default" queue.
    # Without listing both, queue:work only drains "default" and publish jobs
    # sit stuck in the jobs table forever.
    command: ["php", "artisan", "queue:work", "database", "--queue=publishing,default", "--tries=3", "--backoff=10,30,60", "--sleep=3", "--timeout=60", "--max-time=3600"]
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    environment: *laravel-environment
    depends_on:
      mysql:
        condition: service_healthy
    # IMPORTANT: SQLite must never be substituted here if this service is
    # ever scaled beyond 1 replica — PDO SQLite's busy_timeout does not
    # reliably gate multi-process write contention (confirmed during this
    # project's Production Readiness Audit). MySQL is required for any
    # deployment running more than one queue worker.

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    environment: *laravel-environment
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ../public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_HOSTNAME: "${APP_HOSTNAME:?Set the public API hostname, for example staging-api.example.com}"
      ACME_EMAIL: "${ACME_EMAIL:?Set the certificate renewal email}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?Set DB_DATABASE through the deployment configuration}"
      MYSQL_USER: "${DB_USERNAME:?Set DB_USERNAME through the deployment secret store}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD through the deployment secret store}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD through the deployment secret store}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_storage:
  mysql_data:
  caddy_data:
  caddy_config:
