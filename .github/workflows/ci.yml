name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""
        # Hard gate, unlike the PHPStan step below — a real secret leak must
        # fail the build outright (P0-4 from the CTO audit: Sanctum tokens
        # were previously committed under docs/audit/evidence/).

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo, pdo_sqlite, gd, zip, bcmath
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          APP_ENV: testing

      - name: Validate Composer metadata
        run: composer validate

      - name: Enforce PHP formatting
        run: vendor/bin/pint --test

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          ADMIN_PASSWORD: CiOnlyPlaceholder123!

      - name: Static analysis (PHPStan/Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G
        # Full app analysis is clean; this is intentionally a required gate.

      - name: Run test suite
        # External report #3 (2026-08-15) flagged --min=0 as a no-op
        # "quality gate." 50% was a deliberately conservative starting
        # floor, not a target — chosen without a local Xdebug/PCOV
        # environment to measure actual coverage against, so it was set low
        # enough to be safe rather than guessed against a real number.
        #
        # 2026-08-16: --coverage-html/--coverage-clover added here (CI-only,
        # not in phpunit.xml) after finding the "Upload coverage artifact"
        # step below had been silently uploading nothing for every run —
        # neither this command nor phpunit.xml ever told PHPUnit where to
        # actually write a report, so --min enforced the threshold purely
        # in-memory with nothing left on disk to upload. Deliberately NOT
        # added to phpunit.xml's <coverage> block: doing that made PHPUnit
        # attempt coverage-driver setup on every plain local
        # `php artisan test` run too (no --coverage flag needed to trigger
        # it), which silently crashed with zero output on a machine without
        # Xdebug/PCOV — confirmed by reproducing, then reverting it.
        # Keeping these flags CI-only avoids that regression entirely.
        #
        # With a real report finally in hand, first-ever measured coverage
        # was 80.9% statements (4639/5734, clover.xml project metrics) —
        # first ratchet step per the plan this comment already described:
        # 50 -> 75%. Deliberately not set to ~80 (the exact measured number)
        # yet: leave headroom before tightening further, confirm this floor
        # holds stable across a few more runs first. Remaining ratchet plan:
        # 75 -> 80%; then a second `php artisan test --coverage --min=90`
        # pass scoped via `--filter`/a dedicated phpunit.critical.xml
        # `<source><include>` to app/Services (publishing), app/Policies,
        # app/Http/Middleware, and app/Support/{Auth,Tenancy} specifically.
        run: php artisan test --coverage --min=75 --coverage-html=coverage/html --coverage-clover=coverage/clover.xml
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        continue-on-error: true

  docker-build:
    # 2026-08-16: neither this repo nor any local sandbox this project has
    # been developed in has ever had a `docker` binary available, so
    # `docker build`/`docker compose up` had literally never been exercised
    # anywhere — the "Docker source hardening" PHPUnit test only greps
    # Dockerfile/compose text, it never actually builds or boots an image.
    # GitHub-hosted runners have Docker preinstalled, so this closes that
    # gap in CI instead of waiting on a local environment that may never
    # have it. Deliberately informational-only for now (not yet added to
    # the branch-protection required-checks list) until it's proven stable
    # over a few real runs — the exact same script has never run before,
    # written and pushed without a way to test-drive it locally first.
    name: Docker build and boot smoke test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: smart_publisher_docker_ci
          MYSQL_USER: smart_publisher_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the self-hosted Compose image (docker/Dockerfile)
        run: docker build -f docker/Dockerfile -t smart-publisher-app:ci .

      - name: Build the Render web-service image (docker/render/Dockerfile)
        run: docker build -f docker/render/Dockerfile -t smart-publisher-render:ci .

      - name: Boot the Render image and smoke-test /up
        # APP_ENV=testing (not staging/production) deliberately skips
        # DeploymentConfigurationGuard's HTTPS/mailer/CORS enforcement here
        # -- this step verifies the image builds, migrates, and serves real
        # HTTP, not staging security posture (that's covered separately by
        # DeploymentConfigurationGuardTest). --network host lets this
        # container reach the mysql service container via 127.0.0.1, same
        # as the mysql-publishing-reliability job below.
        run: |
          APP_KEY=$(docker run --rm smart-publisher-render:ci php artisan key:generate --show)
          docker run -d --name render-smoke --network host \
            -e APP_ENV=testing \
            -e APP_KEY="$APP_KEY" \
            -e APP_URL=http://127.0.0.1:8090 \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_DATABASE=smart_publisher_docker_ci \
            -e DB_USERNAME=smart_publisher_ci \
            -e DB_PASSWORD=ci-only-password \
            -e CACHE_STORE=database \
            -e SESSION_DRIVER=database \
            -e QUEUE_CONNECTION=database \
            -e PORT=8090 \
            smart-publisher-render:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8090/up; then
              echo "Container is up and serving /up"
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy within 60s"
          exit 1

      - name: Container logs (always, for diagnosis)
        if: always()
        run: docker logs render-smoke || true

  mysql-publishing-reliability:
    name: MySQL 8.4 publishing reliability
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: smart_publisher_ci
          MYSQL_USER: smart_publisher_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP with MySQL support
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo, pdo_mysql, gd, zip, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          APP_ENV: testing

      - name: Prepare MySQL test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate:fresh --force
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: smart_publisher_ci
          DB_USERNAME: smart_publisher_ci
          DB_PASSWORD: ci-only-password
          ADMIN_PASSWORD: CiOnlyPlaceholder123!

      - name: Run MySQL publishing reliability and isolation tests
        run: >-
          php artisan test
          tests/Feature/PublishingReliabilityAcceptanceTest.php
          tests/Feature/MultiTargetPublicationBatchCompletionTest.php
          tests/Feature/MySqlPublishingConcurrencyTest.php
          tests/Feature/CrossUserIsolationTest.php
          tests/Feature/DeadLetterRetryTest.php
          tests/Feature/PublishPostJobMembershipCheckTest.php
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: smart_publisher_ci
          DB_USERNAME: smart_publisher_ci
          DB_PASSWORD: ci-only-password
